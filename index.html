<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vonk">
  <meta name="description" content="Vonk: leer je woordjes met combo's, kisten, ringen en eindbazen, en onthoud ze echt dankzij slimme herhaling.">
  <title>Vonk</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/game.css">

  <script>
    // Thema en weergave toepassen vóór de eerste paint, zodat er niets knippert.
    try {
      var saved = JSON.parse(localStorage.getItem('vonk:v1') || 'null');
      if (saved && saved.settings) {
        if (saved.settings.appearance && saved.settings.appearance !== 'system') {
          document.documentElement.dataset.theme = saved.settings.appearance;
        }
        if (saved.settings.theme) document.documentElement.dataset.accent = saved.settings.theme;
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" class="app">
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <nav id="tabbar" class="tabbar" aria-label="Hoofdmenu"></nav>

  <div id="layer" class="layer"></div>
  <div id="island" class="island" role="status" aria-live="polite"></div>
  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <div id="file-warning" class="file-warning" hidden>
    <div class="file-warning-card">
      <h1>Vonk moet via een webadres openen</h1>
      <p>Je opende <code>index.html</code> rechtstreeks vanaf je schijf. Browsers blokkeren dan de scripts van Vonk.</p>
      <p>Speel via de GitHub Pages-link uit de README, of start een lokale server in deze map:</p>
      <pre>npx serve .</pre>
    </div>
  </div>
  <script>
    if (location.protocol === 'file:') document.getElementById('file-warning').hidden = false;
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
